[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "tracker/migrations",
    "staticfiles",
    "static",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | tracker/migrations
  | staticfiles
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["tracker/migrations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "task_tracker.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--tb=short -ra"

[tool.coverage.run]
source = ["tracker", "task_tracker"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "task_tracker/wsgi.py",
    "task_tracker/asgi.py",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
